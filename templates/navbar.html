<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            <i class="fas fa-shipping-fast me-2"></i>Encomiendas
        </a>

        {% if user.is_authenticated %}

        <!-- Botón hamburguesa (responsive) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'encomienda_lista' %}">
                        Encomiendas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'encomienda_crear' %}">
                        Nueva
                    </a>
                </li>

            </ul>

            <div class="d-flex align-items-center">
                <span class="navbar-text me-3">
                    <i class="fas fa-user me-1"></i>{{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" id="logout-form" style="display:none;">
                    {% csrf_token %}
                </form>
                <a href="#" class="btn btn-outline-light btn-sm"
                   onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                    <i class="fas fa-sign-out-alt me-1"></i>Salir
                </a>
            </div>

        </div>

        {% else %}

        <a href="{% url 'login' %}" class="btn btn-outline-light">
            <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesión
        </a>

        {% endif %}
